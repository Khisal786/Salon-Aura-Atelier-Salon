<div id="bookingModal" class="booking-modal-overlay" style="display: none;">
  <div class="booking-modal-container">
    <div class="modal-header">
      <div>
        <span class="modal-subtitle">Secure Your Appointment</span>
        <h3 id="modalServiceName">Bespoke Cut & Blowdry</h3>
      </div>
      <button class="close-modal-btn" onclick="closeBookingModal()">&times;</button>
    </div>

    <form id="bookingForm" class="booking-form" onsubmit="dispatchBooking(event)">
      <div class="form-group">
        <label for="clientName">Full Name</label>
        <input type="text" id="clientName" required placeholder="e.g., Sarah Jenkins">
      </div>

      <div class="form-group">
        <label for="clientPhone">Phone Number (for confirmation)</label>
        <input type="tel" id="clientPhone" required placeholder="e.g., +1 (555) 234-5678">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="preferredStylist">Preferred Artist</label>
          <select id="preferredStylist">
            <option value="Any Available">Any Available Master Artist</option>
            <option value="Elena Rostova">Elena Rostova (Creative Director)</option>
            <option value="Marcus Vance">Marcus Vance (Senior Specialist)</option>
            <option value="Chloe Bennett">Chloe Bennett (Color Specialist)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="preferredDate">Preferred Date</label>
          <input type="date" id="preferredDate" required>
        </div>
      </div>

      <div class="form-group">
        <label for="clientNotes">Special Requests / Hair History (Optional)</label>
        <textarea id="clientNotes" rows="2" placeholder="Tell us about your current hair color or specific styling goals..."></textarea>
      </div>

      <div class="modal-actions">
        <button type="submit" class="btn-confirm-booking">Confirm Booking Request</button>
        <p class="modal-disclaimer">No upfront payment required. Our concierge will text you within 15 minutes to confirm exact timing.</p>
      </div>
    </form>
  </div>
</div>
